name: Deploy personal OpenGym

on:
  push:
    branches: [main]
    paths:
      - 'frontend/**'
      - 'catalogue/**'
      - 'scripts/catalogue/**'
      - '.github/workflows/pages.yml'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - run: npm ci
        working-directory: frontend

      - name: Prepare personal local mode
        run: |
          node --input-type=module <<'NODE'
          import { readFileSync, writeFileSync } from 'node:fs'
          const file = 'frontend/src/store/useStore.js'
          let source = readFileSync(file, 'utf8')
          const changes = [
            ['    async boot() {', "    async boot() {\n      if (import.meta.env.VITE_LOCAL_ONLY === '1') {\n        get().setGuest(true)\n        finishBoot()\n        return\n      }"],
            ['  s.lang = detectedLang()', "  s.lang = import.meta.env.VITE_LOCAL_ONLY === '1' ? 'zh' : detectedLang()"],
            ['  s.langAuto = true', "  s.langAuto = import.meta.env.VITE_LOCAL_ONLY !== '1'"]
          ]
          for (const [before, after] of changes) {
            if (source.split(before).length !== 2) throw new Error('Source changed; check: ' + before)
            source = source.replace(before, after)
          }
          writeFileSync(file, source)
          for (const path of [file, 'frontend/src/lib/media-sync.js', 'frontend/index.html']) {
            writeFileSync(path, readFileSync(path, 'utf8').replaceAll('gym_state_v1', 'gym_personal_state_v1'))
          }
          const page = 'frontend/index.html'
          const loading = '<div id="root"><p id="startup" style="color:#eee;text-align:center;padding:40vh 20px;font-family:system-ui">正在打开 OpenGym…</p></div><script>setTimeout(function(){var e=document.getElementById("startup");if(e){e.textContent="页面暂时无法加载，请检查网络后刷新重试。"}},20000)</script>'
          writeFileSync(page, readFileSync(page, 'utf8').replace('<div id="root"></div>', loading))
          NODE

      - run: npm run build
        working-directory: frontend
        env:
          VITE_DEMO: '0'
          VITE_LOCAL_ONLY: '1'

      - run: node scripts/catalogue/stage-media.mjs frontend/dist

      - uses: actions/configure-pages@v6

      - uses: actions/upload-pages-artifact@v5
        with:
          path: frontend/dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - id: deploy
        uses: actions/deploy-pages@v5

      
